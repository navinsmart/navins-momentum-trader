name: Momentum Portfolio Rebalance

on:
   # Runs every Friday at 20:30 UTC (≈ 4:30 PM Eastern Time)
  schedule:
    - cron: '30 20 * * 5'

  # Allows manual run anytime
  workflow_dispatch:

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Momentum Trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python momentum_live.py

